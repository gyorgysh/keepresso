<!doctype html>
<!--
  The disk image window's background, 660 x 400 points. This file is the
  source. background.png and background@2x.png are rendered from it by
  scripts/render-dmg-background.sh and committed, so a release needs no
  browser.

  Finder draws the two icons on top, centred at (180, 205) and (480, 205)
  with 128 point icons, as set in dmg-settings.py. The arrow sits on that
  centre line. Move one and move the other.

  The ground is light on purpose. Finder picks the icon label colour from the
  background, not from the system appearance, so dark labels stay readable
  on this paper in both light and dark mode.

  Type is the system font. Colour follows the brand colorways in
  docs/assets/brand: a cool neutral ground with blue washes and the brand
  blue accent.
-->
<html><head><meta charset="utf-8"><style>
html, body { margin: 0; width: 660px; height: 400px; overflow: hidden }
body { position: relative; background: #f4f4f4; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; -webkit-font-smoothing: antialiased }
.wash { position: absolute; inset: 0 }
.sky { background: radial-gradient(75% 90% at 8% -10%, rgba(110, 175, 246, .16), rgba(110, 175, 246, 0) 60%) }
.deep { background: radial-gradient(80% 100% at 105% 110%, rgba(0, 122, 255, .10), rgba(0, 122, 255, 0) 60%) }
.mark { position: absolute; top: 40px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 10px; font-weight: 700; font-size: 27px; letter-spacing: -.02em; color: #111 }
.mark svg { position: static; width: 20px; height: 23px }
.tagline { position: absolute; top: 82px; width: 100%; text-align: center; font-weight: 500; font-size: 13px; color: #5f6368 }
svg.arrow { position: absolute; left: 0; top: 0 }
.hint { position: absolute; top: 322px; left: 50%; transform: translateX(-50%); padding: 6px 14px; border-radius: 999px; background: #e3edf9; color: #0a5ec2; font-weight: 600; font-size: 12px; white-space: nowrap }
.note { position: absolute; bottom: 22px; width: 100%; text-align: center; font-size: 10.5px; color: #8a8f96 }
</style></head><body>
<div class="wash sky"></div>
<div class="wash deep"></div>
<div class="mark"><svg viewBox="0 0 562 650" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6EAFF6"/><stop offset=".8" stop-color="#007AFF"/></linearGradient></defs><path fill="url(#g)" fill-rule="evenodd" d="M0 0H562V650H0V231H190L0 124ZM190 231 557 438 190 645Z"/></svg>Pervigil</div>
<div class="tagline">Keep your Mac awake, on your terms</div>
<svg class="arrow" width="660" height="400" viewBox="0 0 660 400">
  <defs>
    <linearGradient id="trail" x1="290" x2="368" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#007AFF" stop-opacity=".3"/>
      <stop offset="1" stop-color="#007AFF"/>
    </linearGradient>
  </defs>
  <path d="M290 205 H366" stroke="url(#trail)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M359 197 L367.5 205 L359 213" fill="none" stroke="#007AFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<div class="hint">Drag to Applications</div>
<div class="note">An unofficial fork of Keepresso</div>
</body></html>
