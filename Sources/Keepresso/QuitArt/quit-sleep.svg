<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140" role="img" aria-hidden="true">
  <defs>
    <mask id="mooncut">
      <rect width="200" height="140" fill="white"/>
      <circle cx="128" cy="46" r="9" fill="black"/>
    </mask>
  </defs>
  <style>
    .screen { fill: #232936; }
    .deck { fill: #2e3542; }
    .moon { fill: #f2c66d; }
    .zee { fill: none; stroke: #f2c66d; stroke-linecap: round; stroke-linejoin: round; }
    .glow { fill: #7ba7ff; animation: breathe 3.2s ease-in-out infinite; }
    .z1 { animation: drift 3s ease-in infinite; }
    .z2 { animation: drift 3s ease-in 1s infinite; }
    .z3 { animation: drift 3s ease-in 2s infinite; }
    @keyframes drift {
      0% { transform: translateY(0); opacity: .95; }
      70% { opacity: .9; }
      100% { transform: translateY(-16px); opacity: 0; }
    }
    @keyframes breathe {
      0%, 100% { opacity: .22; }
      50% { opacity: .45; }
    }
    @media (prefers-color-scheme: dark) {
      .screen { fill: #313a4a; }
      .deck { fill: #3d4657; }
      .glow { fill: #8fb4ff; }
    }
    @media (prefers-reduced-motion: reduce) {
      .glow, .z1, .z2, .z3 { animation: none; }
    }
  </style>
  <ellipse class="glow" cx="100" cy="126" rx="62" ry="8"/>
  <rect class="screen" x="55" y="28" width="90" height="62" rx="8"/>
  <path class="deck" d="M40 96 h120 l12 16 h-144 z"/>
  <rect x="92" y="100" width="16" height="4" rx="2" fill="#454e60"/>
  <circle class="moon" cx="122" cy="52" r="11" mask="url(#mooncut)"/>
  <path class="zee z1" d="M148 44 h12 l-12 12 h12" stroke-width="5"/>
  <path class="zee z2" d="M162 30 h9 l-9 9 h9" stroke-width="4"/>
  <path class="zee z3" d="M140 62 h7 l-7 7 h7" stroke-width="3"/>
</svg>
