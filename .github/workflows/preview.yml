name: Preview

# Manual preview: same signed + notarized DMG as Release, but uploaded as a
# run artifact instead of a GitHub Release. Never touches appcast.xml, so
# Sparkle (SUFeedURL = .../releases/latest/download/appcast.xml) can't see it.
#
# Run from: Actions ▸ Preview ▸ Run workflow (requires approval for the
# `release` environment, same as the real release).

on:
  workflow_dispatch:

# Read-only: unlike Release, this never creates releases or uploads assets.
permissions:
  contents: read

jobs:
  preview:
    name: Build, sign, notarize (artifact only)
    runs-on: macos-26
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: latest-stable
      - name: Core tests
        run: swift test
      - name: Install tools
        run: brew install xcodegen

      # Import the Developer ID Application cert into a throwaway keychain that is
      # unlocked only for this job and deleted at the end.
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          CERT="$RUNNER_TEMP/devid.p12"
          echo "$CERT_P12_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT"

      - name: Build and export signed app
        env:
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          xcodegen generate
          xcodebuild archive \
            -project Keepresso.xcodeproj -scheme Keepresso -configuration Release \
            -archivePath build/Keepresso.xcarchive -destination 'generic/platform=macOS' \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$DEVELOPER_ID_APP"
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Keepresso.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export
          codesign --verify --deep --strict --verbose=2 "build/export/Keepresso.app"

      - name: Package and notarize DMG
        env:
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          STAGE=build/dmg; mkdir -p "$STAGE" dist
          cp -R "build/export/Keepresso.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          DMG="dist/Keepresso-preview-$SHORT.dmg"
          hdiutil create -volname Keepresso -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          codesign --force --sign "$DEVELOPER_ID_APP" "$DMG"
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          rm -f "$RUNNER_TEMP/notary.p8"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Upload preview DMG
        uses: actions/upload-artifact@v4
        with:
          name: Keepresso-preview
          path: dist/*.dmg
          retention-days: 14

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
