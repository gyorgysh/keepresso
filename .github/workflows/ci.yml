name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only builds and tests, it never needs write access.
permissions:
  contents: read

jobs:
  localization:
    name: Localization
    # Pure Python over the catalogs, so it needs no Xcode and finishes in
    # seconds. Gating here means a release can never be tagged on a commit
    # where a language is incomplete or the generated .strings are stale.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check every language and the generated .strings
        run: python3 tools/localization/check_all.py

  core-tests:
    name: Core build & tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The project format (objectVersion 77) and swift-testing both need
      # Xcode 16+, so pin to the latest stable Xcode on the runner.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Build & test KeepressoCore
        run: |
          swift build
          swift test

  app-build:
    name: App build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build Keepresso
        run: |
          xcodebuild build \
            -project Keepresso.xcodeproj \
            -scheme Keepresso \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
