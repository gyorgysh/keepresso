name: Keepresso

options:
  bundleIdPrefix: sh.gyorgy
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  KeepressoCore:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  Keepresso:
    type: application
    platform: macOS
    sources:
      - path: Sources/Keepresso
        excludes:
          - sh.gyorgy.keepresso.helper.plist
      # The privileged helper's launchd plist. SMAppService.daemon(plistName:)
      # requires it at Contents/Library/LaunchDaemons inside the app bundle.
      - path: Sources/Keepresso/sh.gyorgy.keepresso.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: KeepressoCore
        product: KeepressoCore
      - package: Sparkle
        product: Sparkle
      - target: KeepressoWidget
        embed: true
      # The command-line tool, copied into Contents/Helpers and signed with
      # the app so the one existing notarization covers it; the Homebrew cask
      # symlinks it onto PATH with a `binary` stanza. Not Contents/MacOS: on
      # a case-insensitive filesystem `keepresso` there would overwrite the
      # `Keepresso` app executable.
      - target: keepresso-cli
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      # The privileged helper daemon (SMAppService LaunchDaemon). Its plist's
      # BundleProgram points at Contents/MacOS/keepresso-helper; no name clash
      # with the app executable, unlike the CLI.
      - target: keepresso-helper
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/MacOS
    info:
      path: Sources/Keepresso/Info.plist
      properties:
        CFBundleName: Keepresso
        CFBundleDisplayName: Keepresso
        CFBundleShortVersionString: "1.11.2"
        CFBundleVersion: "21"
        LSUIElement: true            # menu-bar agent: no Dock icon
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 Keepresso contributors. GNU GPL v3.0."
        # keepresso://start[?duration=<minutes>] / stop / toggle, so scripts and
        # launchers (Shortcuts, Raycast, Alfred) can drive a session.
        CFBundleURLTypes:
          - CFBundleURLName: sh.gyorgy.keepresso
            CFBundleURLSchemes: [keepresso]
        # Reading the joined Wi-Fi SSID (for Wi-Fi triggers) needs Location access.
        NSLocationWhenInUseUsageDescription: "Keepresso reads the name of your current Wi-Fi network so it can keep your Mac awake only on the networks you choose."
        # Listing paired Bluetooth devices (for Bluetooth triggers) is TCC-gated.
        NSBluetoothAlwaysUsageDescription: "Keepresso checks which of your paired Bluetooth devices are connected so it can keep your Mac awake while a chosen device (like headphones) is in use."
        # Reading calendar events (for the calendar trigger) needs full access.
        NSCalendarsFullAccessUsageDescription: "Keepresso checks whether a calendar event is in progress so it can keep your Mac awake during your scheduled sessions."
        # Sparkle auto-update. The appcast is published as an asset on the GitHub
        # Releases page; SUPublicEDKey is the EdDSA key that verifies each update.
        # Generate the key pair once with Sparkle's `generate_keys` tool and paste
        # the printed public key below (the private key stays in the Keychain).
        SUFeedURL: "https://github.com/gyorgysh/keepresso/releases/latest/download/appcast.xml"
        SUPublicEDKey: "n3mCQxtsVXbnaHZEzhv5Yfzr94+Y6CzwBk4jHtrCmm4="
        SUEnableAutomaticChecks: true
    entitlements:
      path: Sources/Keepresso/Keepresso.entitlements
      properties:
        # Shared session state with the widget extension. Expanded at signing
        # so the Team ID stays out of the repo; both processes read the
        # expanded value back from their own signature at runtime
        # (WidgetBridge.appGroupID). Team-ID-prefixed groups also avoid the
        # macOS 15+ group-container prompt.
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)sh.gyorgy.keepresso
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.gyorgy.keepresso
        MARKETING_VERSION: "1.11.2"
        CURRENT_PROJECT_VERSION: "21"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Bridges the Objective-C virtual-display wrapper (private CG API) to Swift.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Keepresso/Keepresso-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        # Not sandboxed by design: App Sandbox blocks IOPMAssertion. This is why
        # Keepresso ships via GitHub/Homebrew, not the Mac App Store.
        ENABLE_APP_SANDBOX: false

  # The caffeinate-style `keepresso` CLI. Also buildable as a SwiftPM
  # executable (`swift build`) for the toolchain-only dev loop; this target
  # exists so the release archive builds, embeds, and signs it with the app.
  keepresso-cli:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/keepresso-cli
    dependencies:
      - package: KeepressoCore
        product: KeepressoCore
    settings:
      base:
        PRODUCT_NAME: keepresso
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        # Embedded in the app; not an install product of its own.
        SKIP_INSTALL: true

  # The privileged helper daemon: registered by the app as an SMAppService
  # LaunchDaemon (one admin approval, ever) and driven over XPC, so
  # closed-display mode and the AWDL watchdog stop asking for the password on
  # every app run. Also buildable with `swift build` for the dev loop.
  keepresso-helper:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/keepresso-helper
    dependencies:
      - package: KeepressoCore
        product: KeepressoCore
    # Embedded as an __info_plist section (no bundle around a bare tool):
    # codesign takes the signing identifier from CFBundleIdentifier, giving
    # the deterministic identifier the XPC peer checks require, in ad-hoc dev
    # builds and Developer ID release builds alike.
    info:
      path: Sources/keepresso-helper/Info.plist
      properties:
        CFBundleName: keepresso-helper
        CFBundleIdentifier: sh.gyorgy.keepresso.helper
    settings:
      base:
        PRODUCT_NAME: keepresso-helper
        # The code-signing identifier both sides verify over XPC; must match
        # HelperService.helperCodeSignIdentifier.
        PRODUCT_BUNDLE_IDENTIFIER: sh.gyorgy.keepresso.helper
        CREATE_INFOPLIST_SECTION_IN_BINARY: true
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        # Embedded in the app; not an install product of its own.
        SKIP_INSTALL: true

  # Widget extension: desktop widgets on macOS 14+, plus the Control Center
  # toggle where it exists (macOS 26+, availability-gated in code). Sandboxed
  # as widgets must be; only the appex, the app stays unsandboxed.
  KeepressoWidget:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/KeepressoWidget
      # The shared brand-mark geometry (CoreGraphics only), so the widgets
      # draw the real cup instead of an SF Symbols lookalike.
      - path: Sources/Keepresso/BrandCupMark.swift
      # The widget/control intents, compiled into both targets so
      # `openAppWhenRun` can run them in the app process (launching it when
      # needed); appex-only intent types make that flag a silent no-op.
      - path: Sources/Keepresso/WidgetIntents.swift
    dependencies:
      - package: KeepressoCore
        product: KeepressoCore
    info:
      path: Sources/KeepressoWidget/Info.plist
      properties:
        CFBundleName: KeepressoWidget
        CFBundleDisplayName: Keepresso
        CFBundleShortVersionString: "1.11.2"
        CFBundleVersion: "21"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Sources/KeepressoWidget/KeepressoWidget.entitlements
      properties:
        # Widget extensions must be sandboxed (only the appex; the app itself
        # stays unsandboxed for IOPMAssertion).
        com.apple.security.app-sandbox: true
        # Shared session state with the app; same signing-time expansion as
        # the app target (see WidgetBridge.appGroupID).
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)sh.gyorgy.keepresso
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.gyorgy.keepresso.widget
        # Brand caramel as the widget accent, else interactive widget buttons
        # fall back to system blue.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Keep in lockstep with the app target's versions on every release
        # bump (the release scripts read the app's, the first in this file).
        MARKETING_VERSION: "1.11.2"
        CURRENT_PROJECT_VERSION: "21"
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic

schemes:
  Keepresso:
    build:
      targets:
        Keepresso: all
    run:
      config: Debug
