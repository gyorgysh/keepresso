    <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="rimLight" x1="0" y1="0" x2="1" y2="1">
